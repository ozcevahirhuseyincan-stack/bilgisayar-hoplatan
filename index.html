<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BİLGİSAYAR HOPLATAN — 5060 Ti FPS DROP</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
(()=>{'use strict';const c=document.getElementById('c');let gl=c.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});if(!gl){gl=c.getContext('webgl',{alpha:false,antialias:false,powerPreference:'high-performance'});}if(!gl){document.body.innerHTML='<div style="color:white;font:20px sans-serif;padding:30px">WebGL açılamadı. Chrome/Edge donanım hızlandırmasını aç.</div>';return;}const is2=gl instanceof WebGL2RenderingContext;
const vs=is2?'#version 300 es\nin vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}':'attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}';
const body=`precision highp float;\n${is2?'in vec2 uv;out vec4 O;':'varying vec2 uv;'}uniform vec2 R;uniform float T;\nfloat h(vec3 p){p=fract(p*.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}\nfloat n(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}\nfloat fbm(vec3 p){float s=0.,a=.5;for(int j=0;j<9;j++){s+=a*n(p);p=p*2.03+vec3(1.7,3.1,2.4);a*=.5;}return s;}\nvoid main(){vec2 q=(uv*2.-1.);q.x*=R.x/R.y;vec3 ro=vec3(0.,0.,-4.2),rd=normalize(vec3(q,1.65));float t=0.;vec3 col=vec3(0.);float tr=1.;for(int i=0;i<420;i++){vec3 p=ro+rd*t;float r=length(p);float ang=.22*T+2.4/(r+.45);float cs=cos(ang),sn=sin(ang);p.xz=mat2(cs,-sn,sn,cs)*p.xz;float d=fbm(p*1.55+vec3(0,T*.035,0)); d=.55*d+.25*fbm(p*3.1-vec3(T*.018,0,0))+.20*fbm(p*5.7+vec3(0,0,T*.012));d=smoothstep(.48,.82,d)*(1.-smoothstep(1.1,3.0,r));float core=exp(-7.*r*r);vec3 cc=mix(vec3(.08,.18,.75),vec3(1.0,.25,.05),fbm(p*2.2));float den=d*.105+core*.025;col+=tr*den*cc*2.1;tr*=1.-den*.72;if(tr<.015)break;t+=.032;}float stars=step(.9987,h(vec3(floor(uv*R*.55),1.)));col+=stars*tr*vec3(1.2);col=1.-exp(-col*1.6);col=pow(col,vec3(.72));${is2?'O=vec4(col,1.);':'gl_FragColor=vec4(col,1.);'}}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}let pr;try{pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,(is2?'#version 300 es\n':'')+body));gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;color:#fff;background:#000;padding:24px;font:14px monospace">Shader başlatılamadı:\n'+String(e)+'</pre>';return}gl.useProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);let uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T');function resize(){let d=Math.min(devicePixelRatio||1,2.0),w=Math.max(2,innerWidth*d|0),h=Math.max(2,innerHeight*d|0);if(c.width!=w||c.height!=h){c.width=w;c.height=h;gl.viewport(0,0,w,h)}}let st=performance.now();function f(now){resize();gl.uniform2f(uR,c.width,c.height);gl.uniform1f(uT,(now-st)/1000);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(f)}requestAnimationFrame(f);
})();
